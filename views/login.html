<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - BudgetBunny</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Use 'media' to automatically match the user's OS light/dark preference
      tailwind.config = { darkMode: "media", theme: { extend: {} } };
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body
    class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4 transition-colors duration-300"
  >
    <div
      class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700 transition-colors duration-300"
    >
      <div class="text-center mb-8">
        <h1
          class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-violet-500 inline-flex items-center gap-2"
        >
          BudgetBunny
          <img src="./images/bunny-icon.svg" alt="bunny" class="inline-block w-8 h-8" />
        </h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">
          Welcome back! Please login to continue.
        </p>
      </div>

      <div
        id="auth-error"
        class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm p-3 rounded-lg mb-6 text-center"
      ></div>

      <form id="loginForm" class="space-y-6">
        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="form__input w-full"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            class="form__input w-full"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full py-3 px-4 rounded-lg text-white font-semibold bg-gradient-to-r from-indigo-500 to-violet-500 hover:from-indigo-600 hover:to-violet-600 shadow-md hover:shadow-lg transition-all transform active:scale-[0.98]"
        >
          Sign In
        </button>
      </form>

      <div class="mt-4 flex items-center justify-between">
        <span class="border-b w-1/5 lg:w-1/4"></span>
        <span class="text-xs text-center text-gray-500 uppercase">or login with</span>
        <span class="border-b w-1/5 lg:w-1/4"></span>
      </div>

      <a
        href="/auth/google"
        class="flex items-center justify-center w-full px-4 py-2 mt-4 text-sm font-medium leading-5 text-gray-700 bg-white border border-gray-300 rounded-lg focus:outline-none focus:ring"
      >
        <svg
          class="w-5 h-5 mr-2"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M23.7449 12.27C23.7449 11.48 23.6849 10.73 23.5549 10H12.2148V14.51H18.7248C18.4348 15.99 17.5848 17.24 16.3248 18.09V21.09H20.1848C22.4749 18.98 23.7449 15.9 23.7449 12.27Z"
            fill="#4285F4"
          />
          <path
            d="M12.2148 24C15.4548 24 18.1848 22.92 20.1848 21.09L16.3248 18.09C15.2448 18.82 13.8448 19.25 12.2148 19.25C9.05484 19.25 6.38484 17.11 5.42484 14.25H1.46484V17.33C3.44484 21.27 7.50484 24 12.2148 24Z"
            fill="#34A853"
          />
          <path
            d="M5.42484 14.25C5.17484 13.52 5.03484 12.77 5.03484 12C5.03484 11.23 5.17484 10.48 5.42484 9.75V6.67H1.46484C0.65484 8.29 0.214844 10.1 0.214844 12C0.214844 13.9 0.65484 15.71 1.46484 17.33L5.42484 14.25Z"
            fill="#FBBC05"
          />
          <path
            d="M12.2148 4.75C13.9848 4.75 15.5548 5.36 16.8048 6.55L20.2748 3.08C18.1748 1.12 15.4548 0 12.2148 0C7.50484 0 3.44484 2.73 1.46484 6.67L5.42484 9.75C6.38484 6.89 9.05484 4.75 12.2148 4.75Z"
            fill="#EA4335"
          />
        </svg>
        Sign in with Google
      </a>

      <p class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
        Don't have an account?
        <a
          href="/register"
          class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium transition-colors"
          >Sign up now</a
        >
      </p>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
