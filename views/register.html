<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register - BudgetBunny</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      // Use 'media' to automatically match the user's OS light/dark preference
      tailwind.config = { darkMode: "media", theme: { extend: {} } };
    </script>

    <link rel="stylesheet" href="css/style.css" />
  </head>

  <body
    class="bg-gray-50 dark:bg-gray-900 flex items-center justify-center min-h-screen p-4 transition-colors duration-300"
  >
    <div
      class="bg-white dark:bg-gray-800 p-8 rounded-2xl shadow-xl w-full max-w-md border border-gray-100 dark:border-gray-700 transition-colors duration-300"
    >
      <div class="text-center mb-8">
        <h1
          class="text-3xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-indigo-500 to-violet-500 inline-flex items-center gap-2"
        >
          BudgetBunny
          <img src="./images/bunny-icon.svg" alt="bunny" class="inline-block w-8 h-8" />
        </h1>
        <p class="text-gray-500 dark:text-gray-400 text-sm mt-2">
          Create an account to start tracking.
        </p>
      </div>

      <div
        id="auth-error"
        class="hidden bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 text-red-600 dark:text-red-400 text-sm p-3 rounded-lg mb-6 text-center"
      ></div>

      <form id="registerForm" class="space-y-5">
        <div>
          <label
            for="name"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Full Name</label
          >
          <input
            type="text"
            id="name"
            required
            class="form__input w-full"
            placeholder="John Doe"
          />
        </div>

        <div>
          <label
            for="email"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Email Address</label
          >
          <input
            type="email"
            id="email"
            required
            class="form__input w-full"
            placeholder="you@example.com"
          />
        </div>

        <div>
          <label
            for="password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Password</label
          >
          <input
            type="password"
            id="password"
            required
            class="form__input w-full"
            placeholder="••••••••"
          />
        </div>

        <div>
          <label
            for="confirm-password"
            class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1"
            >Confirm Password</label
          >
          <input
            type="password"
            id="confirm-password"
            required
            class="form__input w-full"
            placeholder="••••••••"
          />
        </div>

        <button
          type="submit"
          class="w-full py-3 px-4 rounded-lg text-white font-semibold bg-gradient-to-r from-indigo-500 to-violet-500 hover:from-indigo-600 hover:to-violet-600 shadow-md hover:shadow-lg transition-all transform active:scale-[0.98] mt-2"
        >
          Create Account
        </button>
      </form>

      <p class="mt-8 text-center text-sm text-gray-500 dark:text-gray-400">
        Already have an account?
        <a
          href="/login"
          class="text-indigo-600 dark:text-indigo-400 hover:underline font-medium transition-colors"
          >Sign in here</a
        >
      </p>
    </div>

    <script type="module" src="js/auth.js"></script>
  </body>
</html>
